name: CI and GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Read GitHub Pages metadata
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Record GitHub Pages location
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "Pages base URL: ${{ steps.pages.outputs.base_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pages host: ${{ steps.pages.outputs.host }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Type-check, test, and build
        run: npm run check

      - name: Verify deterministic template archive
        shell: bash
        run: |
          cp public/template.zip "${RUNNER_TEMP}/template.zip"
          npm run build:template
          cmp "${RUNNER_TEMP}/template.zip" public/template.zip

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
